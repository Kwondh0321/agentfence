name: 기능 제안
description: 범위가 분명하고 검증 가능한 개선을 제안해 주세요
title: "[기능]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 사용자 요구나 작업 흐름의 빈틈을 해결해야 하나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 가능하면 작은 입력·출력 예제를 포함해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 트레이드오프
