name: Bug report
description: Report a reproducible problem with synthetic or public fixtures
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project. Never include credentials, private data, or confidential files.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the smallest reproducible input and the observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime version, and exact command.
    validations:
      required: true

